  <script>
    // Custom Component to handle AI Combat State Transitions
    AFRAME.registerComponent('responsive-ai', {
      schema: {
        damageThreshold: {type: 'number', default: 5},
        currentDamage: {type: 'number', default: 0}
      },
      init: function () {
        this.el.addEventListener('collidestart', (e) => {
          // Check if collided object is traveling with high velocity (hit hard)
          const body = e.detail.body;
          if (body && body.velocity) {
            const speed = Math.sqrt(body.velocity.x**2 + body.velocity.y**2 + body.velocity.z**2);
            if (speed > this.data.damageThreshold) {
              this.triggerCombatState();
            }
          }
        });
      },
      triggerCombatState: function () {
        // Change appearance to signify aggro and initiate aggressive behavioral routines
        this.el.setAttribute('material', 'color', '#ff3333');
        this.el.setAttribute('animation__aggro', {
          property: 'position',
          to: '0 1 -2', // Route movement vector toward player origin
          dur: 2000,
          loop: true,
          dir: 'alternate'
        });
      }
    });

    // Custom Component for Procedural Arm Deformity / IK Alignment to Controllers
    AFRAME.registerComponent('ik-arm-linker', {
      schema: { target: {type: 'selector'} },
      tick: function () {
        if (!this.data.target) return;
        const targetPos = this.data.target.object3D.position;
        // Dynamically rotate and scale arm meshes to bridge the shoulder-to-controller vector
        this.el.object3D.lookAt(targetPos);
      }
    });
  </script>
